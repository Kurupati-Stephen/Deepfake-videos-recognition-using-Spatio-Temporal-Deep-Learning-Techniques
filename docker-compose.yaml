version: '3.8'

services:
  forensic-dashboard:
    build: .
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

  forensic-api:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
